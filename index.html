const JOBS=[{"id":"emt","n":"EMT & Emergency Care","i":"🚑","d":"Talk with patients and caregivers in an emergency","t":[{"n":"Key Phrases","v":false,"r":[["구급대원입니다. 도와드리겠습니다.","gu-geup-dae-won-im-ni-da. do-wa-deu-ri-ge-sseum-ni-da","I’m an EMT. I’m here to help."],["제 말 들리세요?","je mal deul-li-se-yo","Can you hear me?"],["괜찮으세요?","gwaen-cha-neu-se-yo","Are you okay?"],["무슨 일이 있었나요?","mu-seun i-ri i-sseo-nna-yo","What happened?"],["어디가 아프세요?","eo-di-ga a-peu-se-yo","Where does it hurt?"],["언제부터 아프셨어요?","eon-je-bu-teo a-peu-syeo-sseo-yo","When did the pain start?"],["통증이 얼마나 심하세요?","tong-jeung-i eol-ma-na sim-ha-se-yo","How severe is the pain?"],["숨쉬기 힘드세요?","sum-swi-gi him-deu-se-yo","Are you having trouble breathing?"],["가슴 통증이 있으세요?","ga-seum tong-jeung-i i-sseu-se-yo","Do you have chest pain?"],["어지럽거나 메스꺼우세요?","eo-ji-reop-geo-na me-seu-kkeo-u-se-yo","Do you feel dizzy or nauseated?"],["알레르기가 있으세요?","al-le-reu-gi-ga i-sseu-se-yo","Do you have any allergies?"],["복용 중인 약이 있으세요?","bo-gyong jung-in ya-gi i-sseu-se-yo","Are you taking any medication?"],["기저 질환이 있으세요?","gi-jeo jil-hwa-ni i-sseu-se-yo","Do you have any medical conditions?"],["언제 마지막으로 식사하셨어요?","eon-je ma-ji-ma-geu-ro sik-sa-ha-syeo-sseo-yo","When did you last eat?"],["의식이 있으세요?","ui-si-gi i-sseu-se-yo","Are you conscious?"],["제 손을 꽉 잡아 보세요.","je so-neul kkak ja-ba bo-se-yo","Squeeze my hand."],["제 손가락을 따라 눈을 움직여 보세요.","je son-ga-ra-geul tta-ra nu-neul um-ji-gyeo bo-se-yo","Follow my finger with your eyes."],["천천히 깊게 숨을 쉬세요.","cheon-cheon-hi gip-kke su-meul swi-se-yo","Take a slow, deep breath."],["움직이지 말고 가만히 계세요.","um-ji-gi-ji mal-go ga-man-hi gye-se-yo","Please stay still."],["목을 움직이지 마세요.","mo-geul um-ji-gi-ji ma-se-yo","Please don’t move your neck."],["상처를 확인하겠습니다.","sang-cheo-reul hwa-gin-ha-ge-sseum-ni-da","I’m going to check your injury."],["출혈을 막기 위해 압박하겠습니다.","chul-hyeo-reul mak-kki wi-hae ap-ppak-ha-ge-sseum-ni-da","I’m going to apply pressure to stop the bleeding."],["산소를 공급하겠습니다.","san-so-reul ent"],["보호자","bo-ho-ja","caregiver; family member"],["응급실","eung-geup-sil","emergency room"],["병원","byeong-won","hospital"],["이송","i-song","transport; transfer"],["의식","ui-sik","consciousness"],["호흡","ho-heup","breathing; respiration"],["맥박","maek-ppak","pulse"],["혈압","hyeo-rap","blood pressure"],["체온","che-on","body temperature"],["산소포화도","san-so-po-hwa-do","oxygen saturation"],["혈당","hyeol-ttang","blood sugar"],["산소","san-so","oxygen"],["산소마스크","san-so-ma-seu-keu","oxygen mask"],["심폐소생술","sim-pye-so-saeng-sul","CPR"],["제세동기","je-se-dong-gi","defibrillator"],["자동심장충격기","ja-dong-sim-jang-chung-gyeok-gi","AED"],["들것","deul-kkeot","stretcher"],["응급처치","eung-geup-cheo-chi","first aid; emergency treatment"],["출혈","chul-hyeol","bleeding"],["상처","sang-cheo","wound; injury"],["골절","gol-jeol","fracture"],["통증","tong-jeung","pain"],["알레르기","al-le-reu-gi","allergy"],["복용약","bo-gyong-yak","medication being taken"],["기저 질환","gi-jeo jil-hwan","underlying medical condition"],["통역사","tong-yeok-sa","interpreter"],["구급상자","gu-geup-sang-ja","first-aid kit"],["붕대","bung-dae","bandage"],["압박","ap-ppak","pressure; compression"],["기도","gi-do","airway"],["어지럼증","eo-ji-reom-jeung","dizziness"],["메스꺼움","me-seu-kkeo-um","nausea"],["발작","bal-jak","seizure"],["화상","hwa-sang","burn"],["저체온증","jeo-che-on-jeung","hypothermia"],["열사병","yeol-sa-byeong","heatstroke"],["두통","du-tong","headache"],["복통","bok-tong","abdominal pain"],["요통","yo-tong","back pain"],["호흡곤란","ho-heup-gon-ran","shortness of breath"],["가슴 통증","ga-seum tong-jeung","chest pain"],["발열","ba-ryeol","fever"],["기침","gi-chim","cough"],["감기","gam-gi","cold"],["독감","dok-kam","flu"],["당뇨병","dang-nyo-byeong","diabetes"],["고혈압","go-hyeo-rap","high blood pressure"],["저혈압","jeo-hyeo-rap","low blood pressure"],["심장병","sim-jang-byeong","heart disease"],["천식","cheon-sik","asthma"],["뇌졸중","noe-jol-jung","stroke"],["심장마비","sim-jang-ma-bi","heart attack"],["실신","sil-sin","fainting"],["의식불명","ui-sik-bul-myeong","unconsciousness"],["혼란","hon-ran","confusion"],["쇠약","soe-yak","weakness"],["저림","jeo-rim","numbness; tingling"],["부기","bu-gi","swelling"],["멍","meong","bruise"],["염좌","yeom-jwa","sprain"],["탈구","tal-gu","dislocation"],["찰과상","chal-gwa-sang","abrasion; scrape"],["자상","ja-sang","puncture wound"],["물집","mul-jjip","blister"],["중독","jung-dok","poisoning"],["탈수","tal-su","dehydration"],["저혈당","jeo-hyeol-ttang","low blood sugar"],["고혈당","go-hyeol-ttang","high blood sugar"],["구토","gu-to","vomiting"],["설사","seol-sa","diarrhea"],["복용량","bo-gyong-nyang","dosage"],["처방약","cheo-bang-yak","prescription medication"],["진통제","jin-tong-je","pain reliever"],["항생제","hang-saeng-je","antibiotic"],["인슐린","in-sul-lin","insulin"],["에피네프린","e-pi-ne-peu-rin","epinephrine"],["산소통","san-so-tong","oxygen cylinder"],["흡인기","heu-bin-gi","suction device"],["들것","deul-kkeot","stretcher"],["목 보호대","mok bo-ho-dae","cervical collar"],["부목","bu-mok","splint"],["거즈","geo-jeu","gauze"],["소독약","so-dok-yak","antiseptic"],["체온계","che-on-gye","thermometer"],["혈압계","hyeo-rap-gye","blood pressure monitor"],["혈당 측정기","hyeol-ttang cheuk-jeong-gi","blood glucose meter"],["심전도","sim-jeon-do","electrocardiogram; ECG"],["심박수","sim-bak-su","heart rate"],["호흡수","ho-heup-su","respiratory rate"],["동공","dong-gong","pupil"],["기도 폐쇄","gi-do pye-swae","airway obstruction"],["알레르기 반응","al-le-reu-gi ban-eung","allergic reaction"],["과다 복용","gwa-da bo-gyong","overdose"],["응급 연락처","eung-geup yeon-rak-cheo","emergency contact"]]},{"n":"Common Responses","v":false,"r":[["네, 들려요.","ne, deul-lyeo-yo","Yes, I can hear you."],["괜찮아요. / 괜찮지 않아요.","gwaen-cha-na-yo. / gwaen-chan-chi a-na-yo","I’m okay. / I’m not okay."],["넘어졌어요. / 교통사고가 났어요.","neo-meo-jyeo-sseo-yo. / gyo-tong-sa-go-ga na-sseo-yo","I fell. / I was in a car accident."],["머리가 아파요. / 배가 아파요.","meo-ri-ga a-pa-yo. / bae-ga a-pa-yo","My head hurts. / My stomach hurts."],["한 시간 전부터 아파요.","han si-gan jeon-bu-teo a-pa-yo","It’s been hurting for an hour."],["많이 아파요. / 조금 아파요.","ma-ni a-pa-yo. / jo-geum a-pa-yo","It hurts a lot. / It hurts a little."],["네, 숨쉬기 힘들어요. / 아니요, 괜찮아요.","ne, sum-swi-gi him-deu-reo-yo. / a-ni-yo, gwaen-cha-na-yo","Yes, I’m having trouble breathing. / No, I’m okay."],["네, 가슴이 아파요. / 아니요.","ne, ga-seu-mi a-pa-yo. / a-ni-yo","Yes, my chest hurts. / No."],["어지러워요. / 메스꺼워요.","eo-ji-reo-wo-yo. / me-seu-kkeo-wo-yo","I feel dizzy. / I feel nauseated."],["네, 페니실린 알레르기가 있어요. / 없어요.","ne, pe-ni-sil-lin al-le-reu-gi-ga i-sseo-yo. / eop-sseo-yo","Yes, I’m allergic to penicillin. / No, I have none."],["네, 혈압약을 먹고 있어요. / 없어요.","ne, hyeo-ram-yak-eul meok-kko i-sseo-yo. / eop-sseo-yo","Yes, I take blood pressure medication. / No."],["당뇨가 있어요. / 고혈압이 있어요. / 없어요.","dang-nyo-ga i-sseo-yo. / go-hyeo-ra-bi i-sseo-yo. / eop-sseo-yo","I have diabetes. / I have high blood pressure. / None."],["두 시간 전에 먹었어요.","du si-gan jeo-ne meo-geo-sseo-yo","I ate two hours ago."],["네, 의식이 있어요.","ne, ui-si-gi i-sseo-yo","Yes, I’m conscious."],["네, 잡을 수 있어요.","ne, ja-beul su i-sseo-yo","Yes, I can squeeze your hand."],["네, 해 볼게요.","ne, hae bol-kke-yo","Okay, I’ll try."],["알겠습니다.","al-ge-sseum-ni-da","Understood."],["네, 움직이지 않을게요.","ne, um-ji-gi-ji a-neul-kke-yo","Okay, I won’t move it."],["네, 가족에게 연락해 주세요. / 괜찮아요.","ne, ga-jo-ge-ge yeon-ra-kae ju-se-yo. / gwaen-cha-na-yo","Yes, please contact my family. / No, that’s okay."],["네, 통역사가 필요해요. / 괜찮아요.","ne, tong-yeok-sa-ga pi-ryo-hae-yo. / gwaen-cha-na-yo","Yes, I need an interpreter. / No, that’s okay."],["네, 알겠습니다.","ne, al-ge-sseum-ni-da","Okay, I will."],["여기가 가장 불편해요.","yeo-gi-ga ga-jang bul-pyeon-hae-yo","This area bothers me the most."],["아침에 먹었어요.","a-chi-me meo-geo-sseo-yo","I took it this morning."],["네, 머리를 부딪혔어요. / 아니요.","ne, meo-ri-reul bu-di-chyeo-sseo-yo. / a-ni-yo","Yes, I hit my head. / No."],["네, 알겠습니다.","ne, al-ge-sseum-ni-da","Okay, understood."]]}]},{"id":"home","n":"Everyday Home Life","i":"🏠","d":"Family, meals and daily routines at home","t":[{"n":"Key Phrases","v":false,"r":[["다녀왔어요.","da-nyeo-wa-sseo-yo","I’m home."],["다녀오겠습니다.","da-nyeo-o-ge-sseum-ni-da","I’m heading out."],["오늘 하루 어땠어요?","o-neul ha-ru eo-ttaess-eo-yo","How was your day today?"],["오늘 정말 바빴어요.","o-neul jeong-mal ba-ppa-sseo-yo","I was really busy today."],["오늘 일은 어땠어요?","o-neul i-reun eo-ttaess-eo-yo","How was work today?"],["회사에서 무슨 일이 있었어요?","hoe-sa-e-seo mu-seun i-ri i-sseo-sseo-yo","What happened at work?"],["오늘 회의가 많았어요.","o-neul hoe-ui-ga ma-na-sseo-yo","I had a lot of meetings today."],["야근해야 할 것 같아요.","ya-geun-hae-ya hal kkeot ga-ta-yo","I think I’ll have to work late."],["내일은 재택근무예요.","nae-i-reun jae-taek-geun-mu-ye-yo","I’m working from home tomorrow."],["출근은 몇 시에 해요?","chul-geu-neun myeot si-e hae-yo","What time do you start work?"],["퇴근하고 장 좀 볼게요.","toe-geun-ha-go jang jom bol-kke-yo","I’ll get some groceries after work."],["오늘은 일찍 퇴근할게요.","o-neu-reun il-jjik toe-geun-hal-kke-yo","I’ll get off work early today."],["주말에 뭐 할 거예요?","ju-ma-re mwo hal kkeo-ye-yo","What are you doing this weekend?"],["오늘 저녁은 뭐 먹을까요?","o-neul jeo-nyeo-geun mwo meo-geul-kka-yo","What should we have for dinner tonight?"],["뭐 먹고 싶은 거 있어요?","mwo meok-kko si-peun geo i-sseo-yo","Is there anything you want to eat?"],["저녁 준비를 같이 할까요?","jeo-nyeok jun-bi-reul ga-chi hal-kka-yo","Shall we make dinner together?"],["제가 밥할게요.","je-ga ba-pal-kke-yo","I’ll make the rice."],["식탁 좀 차려 주세요.","sik-ttak jom cha-ryeo ju-se-yo","Please set the table."],["밥 먹을 준비 됐어요?","bap meo-geul jun-bi dwae-sseo-yo","Are you ready to eat?"],["다 같이 식사해요.","da ga-chi sik-sa-hae-yo","Let’s eat together."],["잘 먹겠습니다.","jal meok-kke-sseum-ni-da","Let’s eat. (Said before a meal.)"],["반찬 더 드릴까요?","ban-chan deo deu-ril-kka-yo","Would you like some more side dishes?"],["이거 정말 맛있어요.","i-geo jeong-mal ma-si-sseo-yo","This is really delicious."],["조금 더 먹을래요?","jo-geum deo meo-geul-lae-yo","Would you like a little more?"],["배불러요. 잘 먹었어요.","bae-bul-leo-yo. jal meo-geo-sseo-yo","I’m full. That was delicious."],["설거지는 제가 할게요.","seol-geo-ji-neun je-ga hal-kke-yo","I’ll do the dishes."],["음식물 쓰레기 버려 주세요.","eum-sik-mul sseu-re-gi beo-ryeo ju-se-yo","Please take out the food waste."],["냉장고에 우유가 없어요.","naeng-jang-go-e u-yu-ga eop-sseo-yo","There’s no milk in the fridge."],["장 볼 목록을 적어 둘게요.","jang bol mong-no-geul jeo-geo dul-kke-yo","I’ll write down a grocery list."],["내일 도시락을 싸 줄까요?","nae-il do-si-ra-geul ssa jul-kka-yo","Shall I pack you lunch for tomorrow?"],["청소는 언제 할까요?","cheong-so-neun eon-je hal-kka-yo","When shall we clean?"],["거실을 청소기로 청소할게요.","geo-si-reul cheong-so-gi-ro cheong-so-hal-kke-yo","I’ll vacuum the living room."],["바닥을 닦아 주세요.","ba-da-geul dda-ga ju-se-yo","Please mop the floor."],["빨래를 세탁기에 넣어 주세요.","ppal-lae-reul se-tak-ggi-e neo-eo ju-se-yo","Please put the laundry in the washing machine."],["빨래 다 됐어요. 널어 주세요.","ppal-lae da dwae-sseo-yo. neo-reo ju-se-yo","The laundry is done. Please hang it up."],["마른 옷은 개서 서랍에 넣어 주세요.","ma-reun o-seun gae-seo seo-ra-be neo-eo ju-se-yo","Please fold the dry clothes and put them in the drawer."],["분리수거하는 날이 언제예요?","bul-li-su-geo-ha-neun na-ri eon-je-ye-yo","What day is recycling collected?"],["쓰레기 좀 내다 버려 주세요.","sseu-re-gi jom nae-da beo-ryeo ju-se-yo","Please take out the trash."],["화장실 청소는 제가 할게요.","hwa-jang-sil cheong-so-neun je-ga hal-kke-yo","I’ll clean the bathroom."],["집안일을 나눠서 하면 좋겠어요.","ji-ban-ni-reul na-nwo-seo ha-myeon jo-kke-sseo-yo","It would be good to share the housework."],["오늘은 제가 아이들을 재울게요.","o-neu-reun je-ga a-i-deu-reul jae-ul-kke-yo","I’ll put the kids to bed tonight."],["숙제 다 했어요?","suk-jje da hae-sseo-yo","Did you finish your homework?"],["내일 준비물 챙겼어요?","nae-il jun-bi-mul chaeng-gyeo-sseo-yo","Did you pack what you need for tomorrow?"],["문 잠갔는지 확인해 주세요.","mun jam-gan-neun-ji hwa-gin-hae ju-se-yo","Please check that the door is locked."],["불 좀 꺼 주세요.","bul jom kkeo ju-se-yo","Please turn off the light."],["창문을 열어도 돼요?","chang-mu-neul yeo-reo-do dwae-yo","Can I open the window?"],["집이 좀 추워요.","ji-bi jom chu-wo-yo","It’s a little cold in the house."],["난방 온도를 조금 낮출까요?" const cl=s=>s.replace(/[.?!,]/g,"").trim(),JT=[["fill","✏️","Fill in the Blanks","8 phrases with a missing word"],["match","🔗","Word Matching","Match 12 words in 3 rounds"],["read","📖","Reading Quiz","8 short reading questions"]];
const jdone=j=>{const p=S.pr[j.id]||{};return JT.filter(t=>p[t[0]]&&p[t[0]].done).length};

function jobPage(k){const j=JOBS[k];MATE=pickMate();const p=S.pr[j.id]||{};
 $("v").innerHTML=`<button class="btn alt" onclick="go('practice')">All topics</button><div class="row" style="margin-top:8px">${spr(MATE,"idle",100,"mate")}<div class="grow"><h2 style="margin:0">${j.i} ${j.n}</h2><div class="mute">${j.d}</div></div></div>${mbars(j)}`+
 JT.map(t=>{const e=p[t[0]];return `<button class="opt" onclick="jobStart(${k},'${t[0]}')"><b>${e&&e.done?"✅":"⬜"} ${t[1]} ${t[2]}</b><br><span class="mute">${t[3]}${e?` · Best ${e.best}% · ${e.n} ${e.n>1?"tries":"try"}`:""}</span></button>`}).join("")+
 `<h2>Study</h2>`+j.t.map(t=>`<details class="c"><summary><b>${t.n}</b> <span class="mute">(${t.r.length})</span></summary>${t.r.map(r=>`<div class="row" style="margin:8px 0">${sayBtn(r[0])}<div class="grow"><b class="ko" style="font-size:18px">${r[0]}</b><div class="rom">${r[1]}</div><div class="mute">${r[2]}</div></div></div>`).join("")}</details>`).join("")}
function jobFinish(k,type,sc,n){const j=JOBS[k],pct=Math.round(sc/n*100),p=S.pr[j.id]=S.pr[j.id]||{},e=p[type]=p[type]||{best:0,n:0},was=jdone(j);e.n++;if(pct>e.best)e.best=pct;e.done=e.best>=70;save();
 if(jdone(j)==3&&was<3){S.gems+=20;toast(j.n+" complete! +20 "+KB(16));raw();hud()}}
function jobStart(k,type){const j=JOBS[k];const back=`jobPage(${k})`;
 if(type=="match")return jobMatch(k);
 const qs=type=="fill"?jobFill(j,8):jobRead(j,8);if(!qs.length){toast("Nothing to quiz yet");return}
 qz(type=="fill"?"Fill in the Blanks":"Reading Quiz",qs,{done:(sc,n)=>{jobFinish(k,type,sc,n);result(sc,n,need(n),back,sc>=need(n)?"":` You need ${need(n)} correct to pass.`)}})}
function jobFill(j,n=8){const toks=[...new Set(j.P.flatMap(p=>p.k.split(/\s+/).map(cl)).filter(t=>t.length>=2))],vb=[],tb=[];
 sh(j.P).forEach(p=>{const words=p.k.split(/\s+/);let a,d,v=null;
  const vs=sh(j.V.filter(x=>{const c=cl(x.k);return c.length>=2&&p.k.split(c).length==2}));
  if(vs.length){v=vs[0];a=cl(v.k);d=near(a,j.V.map(x=>cl(x.k)).filter(c=>c.length>=2&&!p.k.includes(c)),3)}
  else{const cs=words.map(cl).filter(t=>t.length>=2&&p.k.split(t).length==2);if(!cs.length)return;a=cs[Math.floor(Math.random()*cs.length)];d=near(a,toks.filter(t=>!p.k.includes(t)&&!t.includes(a)&&!a.includes(t)),3)}
  if(d.length<3)return;const q={p:p.k.replace(a,"<span class=\"blank\">＿＿</span>"),fs:24,s:p.e,a,o:[a,...d],t:p.k,rv:{id:"j|"+p.k,k:p.k,e:p.e,r:p.r,src:j.n},ms:["p|"+j.id+"|"+p.k].concat(v?["w|"+j.id+"|"+v.k]:[]),x:jex(p)+(v?`<p class="mute">${v.k} = ${v.e}${v.r?" ("+v.r+")":""}</p>`:"")};(v?vb:tb).push(q)});
 const wq=q=>mw(q.ms[0]),pick=wsh(vb,wq).slice(0,Math.max(n-2,Math.min(n,vb.length))).concat(wsh(tb,wq));return sh(pick.slice(0,n))}
function jobRead(j,n=8){const qs=[],allE=j.P.map(p=>p.e),allK=j.P.map(p=>p.k);
 for(const p of wsh(j.P,p=>mw("p|"+j.id+"|"+p.k))){if(qs.length>=n)break;const tb=j.t.find(t=>t.n==p.tab),rows=tb.r,s=Math.max(0,Math.min(p.idx-1,rows.length-3)),lines=rows.slice(s,s+3),rv={id:"j|"+p.k,k:p.k,e:p.e,r:p.r,src:j.n},x=jex(p)+`<hr><div class="mute">In context</div>`+exRows(lines.map(l=>[l[0],l[2]]));
  if(qs.length%2==0)qs.push({h:`<div class="pass">${lines.map(l=>`<div class="ln ko${l[0]==p.k?" hi":""}">${l[0]}</div>`).join("")}</div>`,s:"What does the highlighted line mean?",a:p.e,o:[p.e,...near(p.e,allE,3)],t:p.k,rv,x,ms:["p|"+j.id+"|"+p.k]});

function jobMatch(k){const j=JOBS[k],pk=[];for(const v of wsh(j.V,v=>mw("w|"+j.id+"|"+v.k))){if(pk.length>=12)break;if(!pk.some(p=>p.e==v.e&&true)&&!pk.some(p=>share(p.e,v.e)))pk.push(v)}
 const R=Math.ceil(pk.length/4),miss=new Set();let r=0,L,Rt,dn,sel;

  $("v").innerHTML=`<div class="row" style="margin-bottom:6px">${spr(MATE,"idle",84,"mate")}<div class="grow"><div class="mute">Word Matching · Round ${r+1} of ${R}</div><div class="bar" style="margin:6px 0 2px"><i style="width:${(r+(fin?1:0))/R*100}%"></i></div></div></div><p class="mute" style="text-align:center">Tap a Korean word, then its meaning.</p><div class="two"><div>`+
  L.map((w,i)=>`<button class="opt ${dn[w.k]?"good":""} ${sel&&sel.s=="l"&&sel.i==i?"sel":""} ${sel&&sel.bad==w.k?"bad":""}" ${dn[w.k]?"disabled":""} onclick="mt('l',${i})"><b>${w.k}</b></button>`).join("")+`</div><div>`+
  Rt.map((w,i)=>`<button class="opt sm ${dn[w.k]?"good":""} ${sel&&sel.s=="r"&&sel.i==i?"sel":""}" ${dn[w.k]?"disabled":""} onclick="mt('r',${i})">${w.e}</button>`).join("")+`</div></div>`+
  (fin?`<button class="btn" onclick="mnext()">${r+1<R?"Next round":"Finish"}</button>`:"")};
 window.mnext=()=>{r++;if(r<R)start();else{const sc=pk.length-miss.size;jobFinish(k,"match",sc,pk.length);result(sc,pk.length,need(pk.length),`jobPage(${k})`)}};
 window.mt=(s,i)=>{const set=pk.slice(r*4,r*4+4);if(s=="l")speak(L[i].k);
  if(!sel||sel.s==s){sel={s,i};draw();return}
